<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXO DIGITAL | Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #1a73e8, #00d4ff);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            margin: 0 auto 20px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .slogan {
            color: #aaa;
            font-size: 15px;
            margin-bottom: 40px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 14px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-whatsapp {
            background: #25D366;
            color: white;
        }

        .btn-whatsapp:hover {
            background: #20ba5a;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 50px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">N</div>
        
        <h1>NEXO DIGITAL</h1>
        <p class="slogan">Tu idea. Nuestra creatividad.</p>

        <!-- Cambia este número por tu WhatsApp real -->
        <a href="https://wa.me/1809XXXXXXX" class="btn btn-whatsapp">
            Cotizar por WhatsApp
        </a>

        <a href="https://www.instagram.com/nexawebrd" class="btn btn-secondary">
            Instagram
        </a>

        <a href="#" class="btn btn-secondary">
            Nuestros Servicios
        </a>

        <p class="footer">NEXO DIGITAL © 2026</p>
    </div>
</body>
</html>
